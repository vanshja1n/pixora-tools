<nav>
    <div class="nav-logo">
        <a href="/fr/" style="text-decoration: none; color: inherit;">Pixora Tools</a>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Ouvrir le menu" aria-expanded="false" type="button">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <ul class="nav-links" id="nav-links">
        <li><a href="/fr/image-compression">Compresser</a></li>
        <li><a href="/fr/image-resize">Redimensionner</a></li>
        <li><a href="/fr/convert-image-format">Convertir</a></li>
        <li class="more-menu">
            <a href="javascript:void(0)" class="more-menu-button">
                <span>Plus d'Outils</span>
                <span class="more-indicator">+</span>
            </a>
            <div class="more-menu-content">
                <a href="/fr/image-rotate">Faire Pivoter</a>
                <a href="/fr/image-watermarking">Filigrane</a>
                <a href="/fr/image-effects">Effets d'Image</a>
                <a href="/fr/image-crop">Recadrer Image</a>
                <a href="/fr/blur-face">Flouter le Visage</a>
                <a href="/fr/remove-background">Supprimer l'Arrière-Plan</a>
                <a href="/fr/tools">Tous les Outils</a>
            </div>
        </li>
        <li><a href="/fr/about">À Propos</a></li>
    </ul>
</nav>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('nav-links');
        const moreMenuButton = document.querySelector('.more-menu-button');
        const moreMenuContent = document.querySelector('.more-menu-content');

        function closeNav() {
            if (hamburger && navLinks) {
                hamburger.classList.remove('active');
                hamburger.setAttribute('aria-expanded', 'false');
                navLinks.classList.remove('active');
                document.body.style.overflow = '';
            }
        }

        if (hamburger && navLinks) {
            hamburger.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = hamburger.classList.toggle('active');
                hamburger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
                navLinks.classList.toggle('active');
                document.body.style.overflow = isOpen ? 'hidden' : '';
            });
        }

        if (moreMenuButton && moreMenuContent) {
            moreMenuButton.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const isShown = moreMenuContent.classList.toggle('show');
                const indicator = moreMenuButton.querySelector('.more-indicator');
                if (indicator) {
                    indicator.textContent = isShown ? '−' : '+';
                }
            });
        }

        if (navLinks) {
            navLinks.querySelectorAll('a:not(.more-menu-button)').forEach(link => {
                link.addEventListener('click', () => {
                    closeNav();
                });
            });
        }

        document.addEventListener('click', (e) => {
            if (navLinks && navLinks.classList.contains('active')) {
                if (!navLinks.contains(e.target) && !hamburger.contains(e.target)) {
                    closeNav();
                }
            }
            if (moreMenuContent && moreMenuContent.classList.contains('show')) {
                if (!moreMenuContent.contains(e.target) && !moreMenuButton.contains(e.target)) {
                    moreMenuContent.classList.remove('show');
                    const indicator = moreMenuButton ? moreMenuButton.querySelector('.more-indicator') : null;
                    if (indicator) indicator.textContent = '+';
                }
            }
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth > 900) {
                closeNav();
            }
        });
    });
</script>
